# ot-turbolaser vulnerable device profile starter set.
#
# Real, public-advisory-sourced vendor/model/firmware -> CVE mappings used by
# red laser. Each profile is rendered into traffic as a genuine OT/ICS protocol
# assertion (a discovery query and its response, or an SNMP fetch) so a sensor's
# CVE match rests on a coherent transaction, not an orphan packet.
#
# This is a starter set. Verify each pairing against the current advisory and
# extend freely. An on-disk file at oui_db.vuln_path overrides this embedded set.
#
# Fields:
#   vendor, model, firmware  identity strings the sensor dissects
#   protocol                 carrier assertion: enip | modbus | s7 | switch_snmp
#   purdue_level             0 field, 1 basic control, 2 supervisory, 3 ops, 4 enterprise
#   oui                      representative vendor OUI (low bytes randomised per device)
#   cves                     advisory-confirmed CVE ids for this model+firmware
#   enip_*                   CIP Identity object numerics (enip profiles)
#   enip_product_name        exact CIP ProductName when it differs from model
#   sys_descr                SNMP sysDescr / LLDP system description (switch_snmp profiles)
#   sys_object_id            SNMP sysObjectID.0 enterprise OID (switch_snmp profiles)
#   firmware_oid             firmware-version OID bound to firmware in the SNMP response
#                            (defaults to ENTITY-MIB entPhysicalFirmwareRev when unset)
#   asset_class              BOM class this SNMP profile fills: Firewall | Router (a
#                            zone's firewall/router then carries a real CVE; switch
#                            profiles leave it unset). Firewalls/routers send no LLDP/CDP.
#   modbus_*                 Modbus device-id object overrides (modbus profiles)

