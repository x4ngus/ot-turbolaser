[package]
name = "ot-turbolaser"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Headless ICS/OT pcap replay appliance. Replays industrial captures with randomised, genuine-looking identifiers and timing onto an isolated mirror feeding a passive sensor."
repository = "https://github.com/x4ngus/ot-turbolaser"
readme = "README.md"

[lib]
name = "ot_turbolaser"
path = "src/lib.rs"

[[bin]]
name = "turbolaser"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
pcap-file = "2"
crc = "3"
ipnet = "2"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
approx = "0.5"

# Release profile tuned for a small, self-contained appliance binary.
# panic = abort keeps the binary smaller; the daemon relies on systemd
# Restart=always as the backstop, so unwinding buys nothing at runtime.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
