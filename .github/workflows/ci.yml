name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tshark lets the *_tshark integration tests actually run instead of skip.
      - name: Install tshark
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        env:
          # tshark is installed above; require it so a lost dissector fails the
          # scenario gate loudly instead of skipping it.
          OT_REQUIRE_TSHARK: "1"
        run: cargo test --all --verbose
      # Prove the *installed* tree can load the scenarios. The unit/integration
      # tests run against the repo-relative conf/, so they cannot catch a
      # packaging gap (the alpha bug shipped because install.sh never laid down
      # conf/targets/ yet CI stayed green). This installs the just-built binary
      # into a sandbox PREFIX and asserts the four packs load through it.
      - name: Install-layout smoke
        run: scripts/install-smoke.sh
