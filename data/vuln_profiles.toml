# --- Zone-edge firewalls and routers (the conduit boundary). Same switch_snmp
# carrier as managed switches (sysDescr + sysObjectID + an explicit firmware OID),
# tagged with asset_class so the bill of materials gives a zone's firewall/router
# a real CVE-bearing identity. Verify each CVE, firmware, and sysObjectID sub-id
# against the current advisory before relying on it.

[[profile]]
