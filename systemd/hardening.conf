# Optional extra hardening for bare metal or VM deployments.
#
# Do NOT use this inside an LXC container. These directives set up a mount
# namespace, which a container cannot do, and the service will fail to start
# with 226/NAMESPACE. The default unit is LXC safe without them.
#
# ReadWritePaths below is set for the /opt/replay install prefix. If you installed
# under a custom PREFIX, use the matching copy install.sh writes to
# $PREFIX/systemd/hardening.conf (its paths already match), not this repo copy.
#
# Install on a host or VM:
#   install -D systemd/hardening.conf \
#     /etc/systemd/system/ot-turbolaser.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart ot-turbolaser

[Service]
ProtectSystem=strict
ReadWritePaths=/run/ot-turbolaser /dev/shm /opt/replay/pcaps /var/lib/ot-turbolaser
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
