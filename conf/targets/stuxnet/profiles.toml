# Stuxnet scenario CVE profiles, overlaid on the embedded set (the S7-300 315-2
# and S7-400 414-3 CPUs are already embedded). Adds the S7-400 417-class cascade
# protection CPU. Verify each pairing against the current advisory.
#
# The order number is the real SIMATIC S7-400H CPU 417-4H MLFB (6ES7 417-4HT14-0AB0);
# the SZL module-identification response carries it, so it must be a genuine
# catalog part or a sensor fingerprinting it would not match. Firmware V4.5.4 is on
# that MLFB's real V4.5.x track. The 417 (cascade protection) is the system the
# Stuxnet "417 code" sabotage warhead targeted. Same OUI/CVE family as the embedded
# S7-400 414-3 profile.

[[profile]]
vendor = "Siemens AG"
model = "SIMATIC S7-417 CPU"
firmware = "V4.5.4"
protocol = "s7"
purdue_level = 1
oui = "00:0E:8C"
cves = ["CVE-2016-9159"]   # credential disclosure over port 102 (ICSA-16-348-05, S7-300/400)
s7_order_number = "6ES7 417-4HT14-0AB0"
